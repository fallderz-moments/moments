<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fallderz Moments</title>
  <meta name="description" content="Fallderz Moments — 狗狗鼠鼠觀察日誌，從 2021 年 12 月開始。">
  <meta name="theme-color" content="#D2E0D3">
  <link rel="icon" href="assets/pixel/chipmunk.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=202610081248">
</head>
<body>
  <header class="site-header">
    <p class="plaque">READING ROOM · EST. 2021</p>
    <a class="brand" href="./">
      <h1>Fallderz <em>Moments</em></h1>
    </a>
    <p class="tagline">狗狗鼠鼠觀察日誌 ‧ 2021.12 — </p>
    <div class="shelf" aria-hidden="true">
      <img class="sprite dog" src="assets/pixel/dog.svg" alt="">
      <img class="sprite books" src="assets/pixel/books.svg" alt="">
      <span class="today-stamp"><small>TODAY</small><span id="today">—</span></span>
      <img class="sprite books flip" src="assets/pixel/books.svg" alt="">
      <img class="sprite chipmunk" src="assets/pixel/chipmunk.svg" alt="">
    </div>
    <nav class="site-nav" aria-label="網站導覽">
      <a href="./" aria-current="page">館藏首頁</a>
      <a href="about.html">關於</a>
      <a href="team.html">協作者名單</a>
      <span class="nav-break" aria-hidden="true"></span>
      <a class="bookmark live" href="./?shelf=live" data-shelf="live">📺 完整直播</a>
      <a class="bookmark series" href="./?shelf=series" data-shelf="series">📚 系列</a>
    </nav>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="segmented" role="group" aria-label="瀏覽方式">
        <button type="button" data-view="notes" aria-pressed="true">便利貼</button>
        <button type="button" data-view="list" aria-pressed="false">列表</button>
      </div>
      <div class="segmented" role="group" aria-label="排序">
        <button type="button" data-sort="desc" aria-pressed="true">新 → 舊</button>
        <button type="button" data-sort="asc" aria-pressed="false">舊 → 新</button>
      </div>
      <span class="toolbar-spacer"></span>
      <label class="search">
        <span class="visually-hidden">搜尋</span>
        <input id="search" class="field" type="search" placeholder="搜尋館藏：標題、內容、標籤…">
      </label>
    </div>
    <div class="catalog-row">
      <span class="row-label">分類</span>
      <div class="tag-filter scroll-row" id="tag-filter" aria-label="分類篩選"></div>
    </div>
    <nav class="catalog-row timeline-nav" aria-label="時間軸">
      <span class="row-label">年份</span>
      <div class="timeline-body">
        <div class="years" id="years"></div>
        <div class="months" id="months"></div>
      </div>
    </nav>
  </div>

  <main id="content">
    <p class="status"><img class="sprite" src="assets/pixel/chipmunk.svg" alt="">翻找館藏中…</p>
  </main>

  <footer class="site-footer">
    <div class="footer-shelf" aria-hidden="true">
      <img class="sprite small" data-pair-fallback src="assets/pixel/heart.svg" alt="">
      <img class="sticker pair-sticker" data-pair-sticker alt="" hidden>
    </div>
    <a class="support-link" href="https://buymeacoffee.com/shiba48" target="_blank" rel="noopener">☕ 支持網站維運</a>
    <p>Fallderz Moments ‧ 狗狗鼠鼠觀察日誌 · <a href="about.html">關於</a> · <a href="team.html">協作者名單</a> · <a href="guide.html">申請手冊</a></p>
  </footer>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="detail-head">
      <button class="icon-btn" type="button" data-nav="prev" aria-label="上一則">‹</button>
      <span class="date" id="detail-date"></span>
      <button class="icon-btn" type="button" data-nav="next" aria-label="下一則">›</button>
      <button class="icon-btn copy-link" type="button" data-copy-link aria-label="複製這則的連結" title="複製連結">🔗</button>
      <button class="icon-btn" type="button" data-close aria-label="關閉">✕</button>
    </div>
    <div class="detail-body">
      <p class="birthday-banner" id="detail-birthday" hidden>
        <img class="sprite" src="assets/pixel/cake.svg" alt="">
        <span>HAPPY BIRTHDAY</span>
        <img class="sprite" id="detail-birthday-sticker" alt="" hidden>
      </p>
      <img class="sticker detail-sticker" id="detail-sticker" alt="" hidden>
      <p class="call-no" id="detail-callno"></p>
      <h2 id="detail-title"></h2>
      <div class="note-tags" id="detail-tags"></div>
      <div class="detail-text" id="detail-text"></div>
      <div class="media-grid" id="detail-media"></div>
      <p class="source" id="detail-source" hidden></p>
      <section class="series-box" id="detail-series" hidden aria-label="本系列其他紀錄"></section>
    </div>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="檢視照片">
    <button class="icon-btn" type="button" data-close-lightbox aria-label="關閉">✕</button>
    <img id="lightbox-img" alt="">
    <a id="lightbox-link" target="_blank" rel="noopener">在 Google 雲端硬碟開啟 ↗</a>
  </dialog>

  <script type="module" src="assets/app.js?v=202610081248"></script>
</body>
</html>
